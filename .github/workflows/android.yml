# Baut bei jeder Änderung die Android-App und veröffentlicht Updates.
#  - Neue Oberfläche (kursradar/VERSION erhöht): Apps laden sie beim nächsten Start still nach.
#  - Neue App-Version (android/APP_VERSION erhöht): neues Release mit APK, Apps fragen nach „Installieren“.
name: Android-App bauen

on:
  push:
    branches: [main]
    paths: ["android/**", "kursradar/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        run: gradle -p android assembleRelease -PupdateRepo=${{ github.repository }} --no-daemon --stacktrace

      - name: Versionen lesen
        id: v
        run: |
          APP=$(tr -d '[:space:]' < android/APP_VERSION)
          WEB=$(tr -d '[:space:]' < kursradar/VERSION)
          IFS=. read -r a b c d <<< "$APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "code=$((a*1000000 + b*10000 + c*100 + d))" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/app-v$APP" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk kursradar.apk

      - name: Release mit APK veröffentlichen (nur bei neuer App-Version)
        if: steps.v.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.v.outputs.app }}
          name: Kursradar App ${{ steps.v.outputs.app }}
          body: Android-App Kursradar ${{ steps.v.outputs.app }} (Oberfläche ${{ steps.v.outputs.web }}). Auf dem Handy öffnen und kursradar.apk installieren.
          files: kursradar.apk
          make_latest: true

      - name: Update-Info für die Apps schreiben
        run: |
          mkdir -p update
          printf '{"web":"%s","app":"%s","appCode":%s,"apk":"https://github.com/%s/releases/latest/download/kursradar.apk"}\n' \
            "${{ steps.v.outputs.web }}" "${{ steps.v.outputs.app }}" "${{ steps.v.outputs.code }}" "${{ github.repository }}" > update/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/version.json
          if ! git diff --cached --quiet; then
            git commit -m "Update-Info: Oberfläche ${{ steps.v.outputs.web }}, App ${{ steps.v.outputs.app }} [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kursradar-apk
          path: kursradar.apk
